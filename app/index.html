    <!-- PNG favicons only. The old /logo-mark.svg was the RETIRED bar-chart
         mark, and an SVG icon link outranks the PNG alternates in every modern
         browser — so tabs kept showing the previous brand after the 2026-08
         rebrand. The generated rasters below are the brand source of truth. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="alternate icon" type="image/png" href="./logo.png" />
    <!-- Opaque 180x180. iOS composites a home-screen icon onto BLACK rather
         than honouring transparency, so the old transparent 512px logo.png
         produced a black tile with a small mark floating in it. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!-- Relative on purpose, so each face picks up its OWN manifest:
         /app/manifest.json and /schools/manifest.json. Without a separate
         manifest per path, "add to home screen" from /schools/ installs an icon
         that opens /app/, because that is the root manifest's start_url — and
         home-screen install is a primary distribution channel in SA schools.
         (vite.config.js's base:"./" would rewrite an absolute href to this form
         anyway; written relative here so the intent survives a base change.) -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Brand: Space Grotesk (800 for the RGB-fade noobtrader wordmark),
         JetBrains Mono for the tagline, Inter for app body text — Inter moved
         here from a runtime @import inside App.jsx's <style>, where the
         browser could not even discover it until React had booted. Press
         Start 2P dropped: nothing in src/ references it (2026-08-15 grep).
         Non-blocking: media="print" keeps the CSS from gating first paint,
         onload flips it live; the preload keeps discovery immediate and
         display=swap keeps text visible on the fallback face meanwhile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
